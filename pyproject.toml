[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyisda"
version = "0.1.0"
description = "Local toolkit for protein structural analysis via the IBDC ISDA API: sequence/protein lookup, UniProt<->PDB residue mapping, mutation retrieval & analysis, ChimeraX mutation scripts, and SASA calculation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pawan" }]
keywords = ["bioinformatics", "structural-biology", "uniprot", "pdb", "isda", "ibdc", "sasa", "mutation"]

dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
sasa = ["biotite>=0.38"]
interactive = ["plotly>=5.18"]
viewer = ["molviewspec>=1.0", "ipython"]
all = ["biotite>=0.38", "plotly>=5.18", "molviewspec>=1.0", "ipython"]

[tool.setuptools.packages.find]
include = ["pyisda*"]
